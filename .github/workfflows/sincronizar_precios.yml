name: Sincronizar Inventario Post-Pago

on:
  repository_dispatch:
    types: [pago_completado]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4

      - name: Ejecutar sincronizador de precios y stock
        run: |
          python amazon_sync.py

      - name: Guardar cambios en el inventario
        run: |
          git config --global user.name "Rodamaster Bot"
          git config --global user.email "bot@rodamaster.com"
          git add inventario_rodamaster_listo.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Inventario actualizado tras confirmación de pago [skip ci]" && git push)
